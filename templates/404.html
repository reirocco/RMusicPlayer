<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Pagina non trovata</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body {
            /* Neon Nights Palette */
            background: linear-gradient(135deg, #020617, #2e1065, #4c1d95);
            background-attachment: fixed;
            color: #ffffff;
            font-family: system-ui, -apple-system, sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            max-width: 500px;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
        }
        .error-code {
            font-size: 6rem;
            font-weight: 800;
            color: #e879f9; /* Fucsia */
            text-shadow: 0 0 20px rgba(232, 121, 249, 0.5);
            margin-bottom: 0;
            line-height: 1;
        }
        .error-msg {
            font-size: 1.5rem;
            margin-bottom: 30px;
            color: #cbd5e1;
        }
        .btn-home {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 12px 30px;
            border-radius: 50px;
            text-decoration: none;
            transition: all 0.3s;
            display: inline-block;
        }
        .btn-home:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
            color: white;
            box-shadow: 0 0 15px rgba(232, 121, 249, 0.3);
        }
    </style>
</head>
<body>
    <div class="glass-panel">
        <h1 class="error-code">404</h1>
        <p class="error-msg">Ops! La traccia si è persa nel mix.</p>
        <a href="/" class="btn-home"><i class="bi bi-house-fill me-2"></i>Torna in Pista</a>
    </div>
</body>
</html>
