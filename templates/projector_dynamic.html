<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Proiettore Karaoke</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            background: black;
            height: 100%;
            width: 100%;
            overflow: hidden;
            color: white;
            font-family: sans-serif;
        }

        #player {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
        }

        .message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 2em;
            text-align: center;
            color: white;
        }
    </style>
</head>
<body>

<div id="message" class="message">In attesa di un video...</div>
<div id="player"></div>

<script>
    let player;
    let currentVideo = null;

    // Carica l'API IFrame di YouTube
    const tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    const firstScriptTag = document.getElementsByTagName('script')[0];
    firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

    // Funzione chiamata quando l'API è pronta
    function onYouTubeIframeAPIReady() {
        player = new YT.Player('player', {
            height: '100%',
            width: '100%',
            videoId: '',
            playerVars: {
                playsinline: 1,
                autoplay: 1,
                controls: 0,
                rel: 0,
                modestbranding: 1,
                enablejsapi: 1
            },
            events: {
                onReady: onPlayerReady,
                onStateChange: onPlayerStateChange
            }
        });
    }

    // Quando il player è pronto
    function onPlayerReady(event) {
        if (currentVideo) {
            event.target.loadVideoById(currentVideo);
            event.target.playVideo();
        }
    }

    // Quando cambia lo stato del player
    function onPlayerStateChange(event) {
        if (event.data === YT.PlayerState.ENDED) {
            document.getElementById('message').style.display = 'block';
            document.getElementById('player').style.display = 'none';
            currentVideo = null;
        }
    }

    // Funzione per controllare ogni secondo se c'è un nuovo video
    function updateVideo() {
        fetch('/get_video')
            .then(res => res.json())
            .then(data => {
                const videoId = data.video_id;
                if (videoId && videoId !== currentVideo && player && player.loadVideoById) {
                    currentVideo = videoId;

                    document.getElementById('message').style.display = 'none';
                    document.getElementById('player').style.display = 'block';

                    player.loadVideoById(videoId);
                }
            })
            .catch(err => {
                console.error("Errore nel recupero video:", err);
            });
    }

    setInterval(updateVideo, 1000);
</script>

</body>
</html>
