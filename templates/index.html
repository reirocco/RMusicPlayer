<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RMusicPlayer - Glass UI</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <style>
        :root {
            --text-main: #ffffff;
            --text-muted: #b0b0b0;
            --glass-bg: rgba(255, 255, 255, 0.07);
            --glass-border: rgba(255, 255, 255, 0.15);
            --glass-hover: rgba(255, 255, 255, 0.15);
            --accent-color: #00d2ff;
        }

        body {
            background: linear-gradient(135deg, #0f172a, #1e1b4b, #311bb6);
            background-attachment: fixed;
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            padding-bottom: 140px;
            overflow-x: hidden;
            min-height: 100vh;
        }

        .header-title { font-weight: 800; letter-spacing: 1px; margin-top: 10px; }
        .header-subtitle { color: var(--accent-color); font-weight: 300; font-size: 1.1rem; margin-bottom: 30px; }

        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
        }

        #loading-screen {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(20px);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .glass-card {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 25px 15px;
            transition: all 0.3s ease;
            cursor: pointer;
            height: 100%;
            min-height: 140px;
            color: var(--text-main);
            text-decoration: none;
        }

        .glass-card:hover {
            background: var(--glass-hover);
            transform: translateY(-5px);
            border-color: rgba(255, 255, 255, 0.3);
        }

        .glass-card i { font-size: 2.8rem; margin-bottom: 12px; }
        .glass-card.folder i { color: #a5b4fc; }
        .glass-card.playlist i { color: #86efac; }
        .card-title { font-size: 1.2rem; font-weight: 600; text-align: center; }

        .pagination-container { display: flex; justify-content: center; align-items: center; gap: 20px; margin-top: 30px; }
        .btn-glass {
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            color: var(--text-main);
            padding: 10px 25px;
            border-radius: 50px;
        }

        .player-bar-wrapper { position: fixed; bottom: 20px; left: 20px; right: 20px; z-index: 1000; display: flex; justify-content: center; }
        .player-glass-deck { width: 100%; max-width: 1200px; display: flex; align-items: center; justify-content: space-between; padding: 15px 25px; }

        .track-name { font-size: 1.1rem; font-weight: bold; color: var(--accent-color); margin: 0; }
        .track-status { font-size: 0.85rem; color: var(--text-muted); margin: 0; }

        .btn-play-pause {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            color: var(--text-main);
            width: 60px; height: 60px; border-radius: 50%;
            font-size: 2rem; display: flex; align-items: center; justify-content: center;
        }
        .btn-play-pause.playing { background: var(--accent-color); color: #000; border: none; }

        .tech-info { font-size: 0.8rem; color: var(--text-muted); text-align: right; }
        .tech-info strong { font-size: 1.3rem; color: var(--text-main); display: block; }

        .nav-bar-custom { display: flex; align-items: center; padding: 10px 20px; margin-bottom: 25px; }
        .nav-bar-custom button { background: transparent; border: none; color: var(--text-main); font-size: 1.5rem; margin-right: 15px; }
    </style>
</head>
<body>

    <div id="loading-screen">
        <div class="spinner-border text-info" role="status"></div>
        <h3 class="mt-3">Analisi Files Audio...</h3>
        <div class="progress w-50 mt-3" style="height: 10px; background: rgba(0,0,0,0.3);">
            <div id="analysis-progress-bar" class="progress-bar bg-info" style="width: 0%;"></div>
        </div>
        <div id="analysis-text" class="text-muted mt-2">Inizializzazione...</div>
    </div>

    <div id="main-content" style="display: none;" class="container-fluid">
        <h1 class="text-center header-title">RMusicPlayer</h1>
        <h2 class="text-center header-subtitle">Glassmorphism Edition</h2>

        <div id="navigation-bar" class="nav-bar-custom glass-panel" style="display: none;">
            <button onclick="goBack()"><i class="bi bi-arrow-left-circle"></i></button>
            <span id="current-path-display" class="nav-path fs-4 fw-bold"></span>
        </div>

        <div class="row g-4" id="folder-container"></div>
        <div id="pagination-container" class="pagination-container" style="display: none;"></div>
    </div>

    <div class="player-bar-wrapper">
        <div class="glass-panel player-glass-deck">
            <div class="player-left">
                <p class="track-status" id="deck-status">Standby</p>
                <p class="track-name" id="deck-track">Seleziona Playlist</p>
            </div>
            <div class="player-center">
                <button id="playPauseBtn" class="btn-play-pause" onclick="togglePlayPause()" disabled>
                    <i class="bi bi-play-fill" id="playPauseIcon"></i>
                </button>
            </div>
            <div class="player-right">
                <div class="tech-info">BPM<strong id="deck-bpm">---</strong></div>
                <div class="tech-info ms-4">KEY<strong id="deck-key">--</strong></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/player.js') }}?v=12"></script>
</body>
</html>
