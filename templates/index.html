<!DOCTYPE html>
<html lang="it">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RMusicPlayer</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/bootstrap.css') }}">

    <style>
        body {
            background-color: black;
            padding: 20px;
            color: white;
        }
        .container {
            max-width: 90%;
            margin: 0 auto;
        }
        .folder-button {
            margin-bottom: 10px;
            width: 100%;
            font-size: 1.5rem;
        }
        .audio-player {
            position: fixed;
            bottom: 10px;
            left: 0;
            right: 0;
            text-align: center;
        }
        .info-bar {
            position: fixed;
            bottom: 10px;
            left: 0;
            right: 0;
            background-color: #000000;
            padding: 10px;
            border-top: 1px solid #ddd;
            text-align: center;
        }
        .info-bar span {
            font-weight: bold;
        }
        .testo{
            color: #ffd700;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="text-center testo">RMusicPlayer</h1>
        <h2 class="text-center testo" >Riccioli D'oro - Mira Montaccini</h2>

        <div id="navigation-bar" style="display: none; margin-bottom: 20px;">
            <button class="btn btn-warning" onclick="goBack()" style="font-size: 1.2rem;">&#8592; Indietro</button>
            <span id="current-path-display" class="ms-3 text-light" style="font-size: 1.2rem; font-weight: bold;"></span>
        </div>

        <div class="row" id="folder-container">
        </div>

        <div class="audio-player ">
        </div>

        <div class="info-bar ">
            <audio id="audioPlayer" controls>
                Your browser does not support the audio element.
            </audio>
            <hr>
            <span id="currentTrackInfo">Nessuna traccia in riproduzione</span>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/bootstrap.bundle.js') }}"></script>
    <script src="{{ url_for('static', filename='js/player.js') }}?v=3"></script>
</body>
</html>
