<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modalità Karaoke</title>
    <!-- Include Bootstrap CSS senza l'attributo integrity -->
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: #f0f0f0;
        }
        .video {
            background: white;
            border-radius: 8px;
            box-shadow: 0 0 8px rgba(0,0,0,0.1);
            margin: 10px 0;
            padding: 10px;
            display: flex;
            align-items: center;
        }
        .video img {
            width: 120px;
            margin-right: 15px;
        }
        .video-info {
            flex: 1;
        }
        .video-title {
            font-weight: bold;
            margin-bottom: 5px;
        }
    </style>
    <script src="{{ url_for('static', filename='config.js') }}"></script>
</head>
<body>

<!-- Barra di navigazione con il pulsante per aprire il projector in alto a destra -->
<nav class="navbar navbar-expand-lg navbar-light bg-light">
    <div class="container-fluid">
        <a class="navbar-brand" href="#">🎤 Modalità Karaoke</a>
        <button class="btn btn-primary" onclick="openProjectionWindow()" style="position: absolute; right: 20px;">Vai alla Proiezione</button>
    </div>
</nav>

<div class="container mt-4">
    <div class="row">
        <div class="col-md-8">
            <input type="text" id="query" class="form-control" placeholder="Cerca canzone karaoke" onkeydown="checkEnter(event)">
        </div>
        <div class="col-md-4">
            <button onclick="searchVideos()" class="btn btn-primary btn-block">Cerca</button>
        </div>
    </div>

    <div id="results" class="mt-4"></div>
</div>

<!-- Include Bootstrap JS e Popper.js senza l'attributo integrity -->
<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.4/dist/umd/popper.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>

<script>
    function openProjectionWindow() {
        // Dimensioni della finestra
        const width = 800;
        const height = 600;
        const left = (window.innerWidth / 2) - (width / 2);
        const top = (window.innerHeight / 2) - (height / 2);

        // Opzioni della finestra
        const windowFeatures = `width=${width},height=${height},top=${top},left=${left},resizable=yes,scrollbars=yes`;

        // Apri la finestra separata con l'URL '/projector'
        window.open('/projector', 'ProjectorWindow', windowFeatures);
    }

    function searchVideos() {
        const query = document.getElementById('query').value + " karaoke";
        const url = `https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&maxResults=10&q=${encodeURIComponent(query)}&embeddable=true&key=${YOUTUBE_API_KEY}`;

        fetch(url)
            .then(response => response.json())
            .then(data => {
                const resultsDiv = document.getElementById('results');
                resultsDiv.innerHTML = '';

                // Filtra i video che possono essere incorporati
                data.items.forEach(item => {
                    if (item.id.kind === 'youtube#video') {
                        const videoId = item.id.videoId;
                        const title = item.snippet.title;
                        const thumbnail = item.snippet.thumbnails.medium.url;

                        const videoDiv = document.createElement('div');
                        videoDiv.className = 'video';

                        videoDiv.innerHTML = `
                            <img src="${thumbnail}" alt="Thumbnail">
                            <div class="video-info">
                                <div class="video-title">${title}</div>
                                <button onclick="projectVideo('${videoId}')" class="btn btn-success">Proietta</button>
                            </div>
                        `;

                        resultsDiv.appendChild(videoDiv);
                    }
                });
            })
            .catch(err => {
                console.error(err);
                alert("Errore nella ricerca. Controlla la chiave API.");
            });
    }

    function projectVideo(videoId) {
        fetch(`/set_video/${videoId}`)
            .then(() => console.log("Video proiettato:", videoId));
    }

    // Funzione per gestire il tasto "Invio"
    function checkEnter(event) {
        if (event.key === "Enter") {
            searchVideos(); // Simula il clic sul pulsante di ricerca
        }
    }
</script>

</body>
</html>
